head:
  title: With Markdown — Tulis Dokumen dalam Markdown
  desc: Editor local-first untuk menulis dokumen apa pun dalam Markdown — buku, makalah, resume, catatan — dengan pratinjau halaman langsung serta ekspor PDF, HTML, dan DOCX yang rapi.
  keywords: editor dokumen markdown, tulis dokumen dalam markdown, pengolah kata markdown, markdown ke pdf, markdown ke docx, editor markdown

landing:
  hero: Tulis apa saja dalam <span text-brand>Markdown</span>!
  desc: Editor local-first untuk menulis apa saja dalam Markdown — buku, makalah, resume, catatan — dengan pratinjau halaman langsung serta ekspor PDF, HTML, dan DOCX yang rapi.
  start: Mulai Menulis
  feats:
    - title: Sederhana dan Powerful
      items: Kelola beberapa dokumen<br>Pratinjau real-time<br>Ekspor ke format PDF<br>Ekspor ke HTML<br>Ekspor ke MS Word (beta)<br>Galeri gambar<br>Sepenuhnya dapat disesuaikan<br>Pilih font dan tambahkan ikon<br>Dan <a href="https://github.com/junian/create-with-markdown#features" target="_blank">fitur lainnya</a>
    - title: Keamanan Utama
      items: Open source dan gratis<br>Data disimpan secara lokal<br>Tidak perlu login atau registrasi<br>Data Anda tidak pernah meninggalkan perangkat Anda<br>Tidak ada penyimpanan atau pemrosesan di server<br>Data Anda selalu milik Anda
  analytics_disclaimer: >
    Saat diakses melalui <a href="https://withmarkdown.com/" target="_blank" class="underline">withmarkdown.com</a>,
    aplikasi ini menggunakan <strong>Google Analytics</strong> dan <strong>Cloudflare Web Analytics</strong> untuk mengukur
    metrik penggunaan seperti jumlah halaman yang dilihat dan pengguna aktif. Konten dokumen dan gambar Anda tidak pernah dikumpulkan atau dikirimkan.
    Dengan menggunakan aplikasi ini, Anda menyetujui <a href="https://withmarkdown.com/privacy/" target="_blank" class="underline">Kebijakan Privasi</a>.

