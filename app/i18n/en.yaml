head:
  title: With Markdown — Write Documents in Markdown
  desc: A local-first editor for writing any document in Markdown — books, papers, resumes, notes — with live page preview and clean PDF, HTML, and DOCX exports.
  keywords: markdown document editor, write documents in markdown, markdown word processor, markdown to pdf, markdown to docx, markdown editor

landing:
  hero: Write anything in <span text-brand>Markdown</span>!
  desc: A local-first editor for writing anything in Markdown — books, papers, resumes, notes — with live page preview and clean PDF, HTML, and DOCX exports.
  start: Start Writing
  feats:
    - title: Simple and Powerful
      items: Manage multiple documents<br>Real-time preview<br>Export to PDF format<br>Export to HTML<br>Export to MS Word (beta)<br>Image gallery<br>Fully customizable<br>Pick fonts and add icons<br>And <a href="https://github.com/junian/create-with-markdown#features" target="_blank">more features</a>
    - title: Security First
      items: Open source and free<br>Data are saved locally<br>No login or registration required<br>Your data never leave your device<br>No server-side storage or processing<br>You own your data, always
  analytics_disclaimer: >
    When accessed via <a href="https://withmarkdown.com/" target="_blank" class="underline">withmarkdown.com</a>,
    this app uses <strong>Google Analytics</strong> and <strong>Cloudflare Web Analytics</strong> to measure aggregate
    usage metrics such as page views and active users. Your document content and images are never collected or transmitted.
    By using this app, you agree to the <a href="https://withmarkdown.com/privacy/" target="_blank" class="underline">Privacy Policy</a>.

