head:
  title: With Markdown — Escribe Documentos en Markdown
  desc: Un editor local-first para escribir cualquier documento en Markdown — libros, artículos, currículums, notas — con vista previa de página en vivo y exportaciones limpias a PDF, HTML y DOCX.
  keywords: editor de documentos markdown, escribir documentos en markdown, procesador de textos markdown, markdown a pdf, markdown a docx, editor markdown

landing:
  hero: ¡Escribe lo que sea en <span text-brand>Markdown</span>!
  desc: Un editor local-first para escribir lo que sea en Markdown — libros, artículos, currículums, notas — con vista previa de página en vivo y exportaciones limpias a PDF, HTML y DOCX.
  start: Empezar a Escribir
  feats:
    - title: Simple y poderoso
      items: Gestiona múltiples documentos<br>Vista previa en tiempo real<br>Exportar a PDF<br>Exportar a HTML<br>Exportar a MS Word (beta)<br>Galería de imágenes<br>Totalmente personalizable<br>Elige fuentes y agrega íconos<br>Y <a href="https://github.com/junian/create-with-markdown#features" target="_blank">más funciones</a>
    - title: Seguridad Primero
      items: Open source y gratuito<br>Los datos se guardan en local<br>No se requiere inicio de sesión ni registro<br>Tus datos nunca salen de tu dispositivo<br>Sin almacenamiento ni procesamiento en el servidor<br>Tus datos son siempre tuyos
  analytics_disclaimer: >
    Cuando se accede desde <a href="https://withmarkdown.com/" target="_blank" class="underline">withmarkdown.com</a>,
    esta aplicación utiliza <strong>Google Analytics</strong> y <strong>Cloudflare Web Analytics</strong> para medir
    métricas de uso agregadas como visitas a páginas y usuarios activos. El contenido de tus documentos y tus imágenes nunca se recopilan ni se transmiten.
    Al usar esta aplicación, aceptas la <a href="https://withmarkdown.com/privacy/" target="_blank" class="underline">Política de Privacidad</a>.

